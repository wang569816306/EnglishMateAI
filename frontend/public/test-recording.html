<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>录音功能自测工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 800px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .test-section {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .test-section h2 {
      color: #495057;
      font-size: 18px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .test-item {
      display: flex;
      align-items: center;
      padding: 10px;
      margin-bottom: 8px;
      background: white;
      border-radius: 8px;
      border-left: 4px solid #dee2e6;
    }

    .test-item.pass {
      border-left-color: #28a745;
      background: #d4edda;
    }

    .test-item.fail {
      border-left-color: #dc3545;
      background: #f8d7da;
    }

    .test-item.warning {
      border-left-color: #ffc107;
      background: #fff3cd;
    }

    .icon {
      font-size: 20px;
      margin-right: 10px;
    }

    .label {
      flex: 1;
      font-weight: 500;
      color: #495057;
    }

    .value {
      color: #6c757d;
      font-size: 13px;
      font-family: 'Courier New', monospace;
    }

    .action-buttons {
      display: flex;
      gap: 15px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 150px;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-success {
      background: #28a745;
      color: white;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .recording-status {
      text-align: center;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
      background: #f8f9fa;
    }

    .recording-status.active {
      background: #fff3cd;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .audio-player {
      margin-top: 20px;
      width: 100%;
    }

    .console-output {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      border-radius: 12px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 20px;
    }

    .console-line {
      margin-bottom: 5px;
      line-height: 1.5;
    }

    .console-line.info {
      color: #4fc3f7;
    }

    .console-line.success {
      color: #81c784;
    }

    .console-line.error {
      color: #e57373;
    }

    .console-line.warn {
      color: #ffb74d;
    }

    .summary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
      text-align: center;
    }

    .summary h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .summary p {
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎤 录音功能自测工具</h1>
    <p class="subtitle">全面检测浏览器录音功能支持情况</p>

    <!-- 环境信息 -->
    <div class="test-section">
      <h2>📋 环境信息</h2>
      <div id="env-tests"></div>
    </div>

    <!-- API 支持检测 -->
    <div class="test-section">
      <h2>🔧 API 支持检测</h2>
      <div id="api-tests"></div>
    </div>

    <!-- 权限状态 -->
    <div class="test-section">
      <h2>🔐 权限状态</h2>
      <div id="permission-tests"></div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-buttons">
      <button class="btn btn-primary" onclick="runAllTests()">
        🔄 重新检测
      </button>
      <button class="btn btn-success" id="recordBtn" onclick="startRecording()">
        🎙️ 开始录音
      </button>
      <button class="btn btn-danger" id="stopBtn" onclick="stopRecording()" disabled>
        ⏹️ 停止录音
      </button>
    </div>

    <!-- 录音状态 -->
    <div id="recordingStatus" class="recording-status" style="display: none;">
      <p>🔴 正在录音...</p>
      <p id="recordingTime">00:00</p>
    </div>

    <!-- 音频播放器 -->
    <audio id="audioPlayer" class="audio-player" controls style="display: none;"></audio>

    <!-- 控制台输出 -->
    <div class="console-output" id="consoleOutput">
      <div class="console-line info">等待检测...</div>
    </div>

    <!-- 总结 -->
    <div id="summary" class="summary" style="display: none;">
      <h3>检测结果</h3>
      <p id="summaryText"></p>
    </div>
  </div>

  <script>
    let mediaRecorder = null;
    let audioChunks = [];
    let recordingStartTime = null;
    let recordingTimer = null;

    // 日志输出
    function log(message, type = 'info') {
      const consoleOutput = document.getElementById('consoleOutput');
      const line = document.createElement('div');
      line.className = `console-line ${type}`;
      
      const timestamp = new Date().toLocaleTimeString();
      line.textContent = `[${timestamp}] ${message}`;
      
      consoleOutput.appendChild(line);
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
      
      // 同时输出到浏览器控制台
      if (type === 'error') {
        console.error(message);
      } else if (type === 'warn') {
        console.warn(message);
      } else {
        console.log(message);
      }
    }

    // 创建测试项
    function createTestItem(label, value, status) {
      const item = document.createElement('div');
      item.className = `test-item ${status}`;
      
      const icon = status === 'pass' ? '✅' : status === 'fail' ? '❌' : '⚠️';
      
      item.innerHTML = `
        <span class="icon">${icon}</span>
        <span class="label">${label}</span>
        <span class="value">${value}</span>
      `;
      
      return item;
    }

    // 运行所有测试
    function runAllTests() {
      log('========== 开始全面检测 ==========', 'info');
      
      testEnvironment();
      testAPIs();
      testPermissions();
      
      log('========== 检测完成 ==========', 'success');
    }

    // 测试环境信息
    function testEnvironment() {
      const container = document.getElementById('env-tests');
      container.innerHTML = '';
      
      log('检测环境信息...', 'info');
      
      // URL
      const url = window.location.href;
      const protocol = window.location.protocol;
      const hostname = window.location.hostname;
      const isLocalhost = ['localhost', '127.0.0.1'].includes(hostname);
      const isHTTPS = protocol === 'https:';
      
      container.appendChild(createTestItem(
        '访问地址',
        url,
        'pass'
      ));
      
      container.appendChild(createTestItem(
        '协议',
        protocol,
        isHTTPS || isLocalhost ? 'pass' : 'warning'
      ));
      
      container.appendChild(createTestItem(
        '主机名',
        hostname,
        isLocalhost ? 'pass' : 'warning'
      ));
      
      // 浏览器信息
      const userAgent = navigator.userAgent;
      let browserName = 'Unknown';
      if (userAgent.includes('Chrome')) browserName = 'Chrome';
      else if (userAgent.includes('Firefox')) browserName = 'Firefox';
      else if (userAgent.includes('Safari')) browserName = 'Safari';
      else if (userAgent.includes('Edge')) browserName = 'Edge';
      
      container.appendChild(createTestItem(
        '浏览器',
        `${browserName} (${userAgent.substring(0, 50)}...)`,
        'pass'
      ));
      
      // 是否在 iframe 中
      const isInIframe = window.self !== window.top;
      container.appendChild(createTestItem(
        'iframe 嵌套',
        isInIframe ? '是' : '否',
        isInIframe ? 'warning' : 'pass'
      ));
      
      log(`环境: ${browserName}, ${protocol}//${hostname}`, 'info');
    }

    // 测试 API 支持
    function testAPIs() {
      const container = document.getElementById('api-tests');
      container.innerHTML = '';
      
      log('检测 API 支持...', 'info');
      
      // navigator.mediaDevices
      const hasMediaDevices = !!navigator.mediaDevices;
      container.appendChild(createTestItem(
        'navigator.mediaDevices',
        hasMediaDevices ? '存在' : '不存在',
        hasMediaDevices ? 'pass' : 'fail'
      ));
      
      if (hasMediaDevices) {
        // getUserMedia
        const hasGetUserMedia = typeof navigator.mediaDevices.getUserMedia === 'function';
        container.appendChild(createTestItem(
          'getUserMedia',
          hasGetUserMedia ? '支持' : '不支持',
          hasGetUserMedia ? 'pass' : 'fail'
        ));
        
        // enumerateDevices
        const hasEnumerateDevices = typeof navigator.mediaDevices.enumerateDevices === 'function';
        container.appendChild(createTestItem(
          'enumerateDevices',
          hasEnumerateDevices ? '支持' : '不支持',
          hasEnumerateDevices ? 'pass' : 'fail'
        ));
      }
      
      // 旧版 API
      const hasWebkitGetUserMedia = !!(navigator.webkitGetUserMedia);
      const hasMozGetUserMedia = !!(navigator.mozGetUserMedia);
      const hasMsGetUserMedia = !!(navigator.msGetUserMedia);
      
      if (hasWebkitGetUserMedia || hasMozGetUserMedia || hasMsGetUserMedia) {
        container.appendChild(createTestItem(
          '旧版 API',
          `webkit:${!!hasWebkitGetUserMedia}, moz:${!!hasMozGetUserMedia}, ms:${!!hasMsGetUserMedia}`,
          'warning'
        ));
      }
      
      // MediaRecorder
      const hasMediaRecorder = typeof MediaRecorder !== 'undefined';
      container.appendChild(createTestItem(
        'MediaRecorder',
        hasMediaRecorder ? '支持' : '不支持',
        hasMediaRecorder ? 'pass' : 'fail'
      ));
      
      if (hasMediaRecorder) {
        // 检查支持的 MIME 类型
        const mimeTypes = [
          'audio/webm',
          'audio/webm;codecs=opus',
          'audio/mp4',
          'audio/ogg;codecs=opus'
        ];
        
        const supportedMimes = mimeTypes.filter(type => MediaRecorder.isTypeSupported(type));
        container.appendChild(createTestItem(
          '支持的音频格式',
          supportedMimes.length > 0 ? supportedMimes.join(', ') : '无',
          supportedMimes.length > 0 ? 'pass' : 'warning'
        ));
      }
      
      log(`API: mediaDevices=${hasMediaDevices}, MediaRecorder=${hasMediaRecorder}`, 'info');
    }

    // 测试权限
    async function testPermissions() {
      const container = document.getElementById('permission-tests');
      container.innerHTML = '';
      
      log('检测权限状态...', 'info');
      
      if (navigator.permissions) {
        try {
          const result = await navigator.permissions.query({ name: 'microphone' });
          
          container.appendChild(createTestItem(
            '麦克风权限',
            result.state,
            result.state === 'granted' ? 'pass' : result.state === 'denied' ? 'fail' : 'warning'
          ));
          
          log(`权限状态: ${result.state}`, result.state === 'granted' ? 'success' : 'warn');
          
          // 监听权限变化
          result.onchange = () => {
            log(`权限变更为: ${result.state}`, 'warn');
            testPermissions();
          };
        } catch (error) {
          container.appendChild(createTestItem(
            '麦克风权限',
            `查询失败: ${error.message}`,
            'warning'
          ));
          log(`权限查询失败: ${error.message}`, 'warn');
        }
      } else {
        container.appendChild(createTestItem(
          'Permissions API',
          '不支持',
          'warning'
        ));
        log('Permissions API 不支持', 'warn');
      }
      
      // 尝试获取设备列表
      if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const audioInputs = devices.filter(device => device.kind === 'audioinput');
          
          container.appendChild(createTestItem(
            '音频输入设备',
            `${audioInputs.length} 个`,
            audioInputs.length > 0 ? 'pass' : 'fail'
          ));
          
          if (audioInputs.length > 0) {
            audioInputs.forEach((device, index) => {
              container.appendChild(createTestItem(
                `设备 ${index + 1}`,
                device.label || `未命名设备 (${device.deviceId.substring(0, 8)}...)`,
                'pass'
              ));
            });
          }
          
          log(`找到 ${audioInputs.length} 个音频输入设备`, 'success');
        } catch (error) {
          container.appendChild(createTestItem(
            '设备枚举',
            `失败: ${error.message}`,
            'fail'
          ));
          log(`设备枚举失败: ${error.message}`, 'error');
        }
      }
    }

    // 开始录音
    async function startRecording() {
      log('========== 开始录音测试 ==========', 'info');
      
      try {
        // 检查支持
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('浏览器不支持 getUserMedia API');
        }
        
        log('请求麦克风权限...', 'info');
        
        // 获取麦克风流
        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            sampleRate: 44100
          }
        });
        
        log('✅ 成功获取麦克风流', 'success');
        log(`音频轨道数: ${stream.getAudioTracks().length}`, 'info');
        log(`轨道状态: ${stream.getAudioTracks()[0].enabled}`, 'info');
        
        // 创建 MediaRecorder
        const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') 
          ? 'audio/webm;codecs=opus' 
          : 'audio/webm';
        
        mediaRecorder = new MediaRecorder(stream, { mimeType });
        audioChunks = [];
        
        log(`使用格式: ${mimeType}`, 'info');
        
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
            log(`收到音频数据: ${event.data.size} bytes`, 'info');
          }
        };
        
        mediaRecorder.onstop = () => {
          log('录音停止', 'info');
          
          const audioBlob = new Blob(audioChunks, { type: mimeType });
          log(`录音完成，总大小: ${audioBlob.size} bytes`, 'success');
          
          // 显示音频播放器
          const audioUrl = URL.createObjectURL(audioBlob);
          const audioPlayer = document.getElementById('audioPlayer');
          audioPlayer.src = audioUrl;
          audioPlayer.style.display = 'block';
          
          log('✅ 录音成功！可以播放回放了', 'success');
          
          // 停止所有轨道
          stream.getTracks().forEach(track => track.stop());
        };
        
        mediaRecorder.onerror = (event) => {
          log(`❌ MediaRecorder 错误: ${event.error}`, 'error');
        };
        
        // 开始录音
        mediaRecorder.start();
        recordingStartTime = Date.now();
        
        // 更新 UI
        document.getElementById('recordBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('recordingStatus').style.display = 'block';
        document.getElementById('recordingStatus').classList.add('active');
        
        // 启动计时器
        recordingTimer = setInterval(updateRecordingTime, 1000);
        
        log('🎤 录音已开始...', 'success');
        
      } catch (error) {
        log(`❌ 录音失败: ${error.message}`, 'error');
        log(`错误名称: ${error.name}`, 'error');
        log(`错误堆栈: ${error.stack}`, 'error');
        
        alert(`录音失败:\n${error.message}\n\n请查看控制台获取详细信息`);
      }
    }

    // 停止录音
    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        
        // 更新 UI
        document.getElementById('recordBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('recordingStatus').style.display = 'none';
        document.getElementById('recordingStatus').classList.remove('active');
        
        // 停止计时器
        if (recordingTimer) {
          clearInterval(recordingTimer);
          recordingTimer = null;
        }
        
        log('⏹️ 已停止录音', 'info');
      }
    }

    // 更新录音时间
    function updateRecordingTime() {
      if (recordingStartTime) {
        const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
        const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const seconds = (elapsed % 60).toString().padStart(2, '0');
        document.getElementById('recordingTime').textContent = `${minutes}:${seconds}`;
      }
    }

    // 页面加载时自动运行测试
    window.addEventListener('load', () => {
      log('页面加载完成', 'info');
      runAllTests();
    });
  </script>
</body>
</html>
